<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact — Addlee</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <header class="site-header">
      <nav>
        <a class="logo" href="/">Addlee</a>
        <ul class="nav">
          <li><a href="/">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/waitlist.html">Join Waitlist</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>Contact Us</h1>
      <p>If you'd like to reach out, send an email to <a href="mailto:hello@addlee.com">hello@addlee.com</a> or use the form below.
      </p>

      <form id="contact-form" action="mailto:hello@addlee.com" method="post" enctype="text/plain" onsubmit="handleContact(event)">
        <label for="cname">Name</label>
        <input id="cname" name="name" type="text" required />

        <label for="cemail">Email</label>
        <input id="cemail" name="email" type="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit" class="cta">Send</button>
      </form>

      <div id="contact-message" aria-live="polite"></div>
    </main>

    <script>
      function handleContact(e) {
        // Allow mailto fallback; also show client-side confirmation
        document.getElementById('contact-message').textContent = 'Thank you — your message will be sent via your email client.';
      }
    </script>

    <footer class="site-footer">
      <p>&copy; Addlee</p>
    </footer>
  </body>
</html>
